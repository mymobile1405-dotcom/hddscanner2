name: Build HddScanner2
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true
      - name: Unzip project
        run: unzip -q HddScanner2.zip
      - name: Build
        run: cd HddScanner2 && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HddScanner2-apk
          path: HddScanner2/app/build/outputs/apk/debug/app-debug.apk
