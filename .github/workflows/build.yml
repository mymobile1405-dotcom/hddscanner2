name: Build HddScanner2
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true
      - name: Unzip project
        run: unzip -q HddScanner2.zip
      - name: Guard - file list must match
        run: |
          cd HddScanner2
          find app/src -type f | sort > /tmp/actual.txt
          diff EXPECTED_FILES.txt /tmp/actual.txt
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: cd HddScanner2 && gradle testDebugUnitTest --no-daemon
      - name: Build APK
        run: cd HddScanner2 && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HddScanner2-apk
          path: HddScanner2/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: HddScanner2/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: echo "UNIT TESTS FAILED" && exit 1
